[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "probabilis"
version = "0.1.0"
description = "Ferramentas para analise de dados e processamento de sinais em ciencias da reabilitacao."
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Conrado Torres"}]
license = "MIT"
keywords = ["statistics", "biomechanics", "EMG", "COP", "signal processing"]
dependencies = ["numpy>=1.24", "scipy>=1.10", "matplotlib>=3.7", "pandas>=2.0"]

[tool.setuptools.packages.find]
where = ["src"]
